[package]
name = "hm-node"
description = "A station's decisions without I/O: acceptance, control plane, routing and custody as a state machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hm-core = { path = "../hm-core" }
hm-wire = { path = "../hm-wire" }
hm-ident = { path = "../hm-ident" }
hm-bundle = { path = "../hm-bundle" }
hm-model = { path = "../hm-model" }
hm-route = { path = "../hm-route" }
hm-store = { path = "../hm-store" }
hm-xfer = { path = "../hm-xfer" }
serde = { version = "1", features = ["derive"] }
blake3.workspace = true

[dev-dependencies]
hm-sim = { path = "../hm-sim" }
serde_json = "1"
