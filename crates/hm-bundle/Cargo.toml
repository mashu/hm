[package]
name = "hm-bundle"
description = "Messages: build, seal, open and verify bundles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["std"]
std = ["dep:zstd"]

[dependencies]
hm-wire = { path = "../hm-wire" }
hm-ident = { path = "../hm-ident" }
minicbor.workspace = true
blake3.workspace = true
zstd = { version = "0.13", default-features = false, optional = true }

[dev-dependencies]
proptest.workspace = true
hm-core = { path = "../hm-core" }
hm-bearer = { path = "../hm-bearer" }
hm-xfer = { path = "../hm-xfer" }
