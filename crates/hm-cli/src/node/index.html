<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hm-net station</title>
<style>
  :root {
    --ink: #1b2a33; --muted: #5b6b73; --paper: #f5f7f6; --sheet: #ffffff;
    --rule: #c9d3d6; --focus: #1f6fb2; --ok: #1e7a46; --warn: #9a6400; --bad: #b3261e;
    --priority: #c99a00; --immediate: #d0620a; --flash: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e3eaec; --muted: #9aabb2; --paper: #121a1f; --sheet: #182329;
      --rule: #2c3b43; --focus: #6fb0e8; --ok: #5ec48a; --warn: #e0b04a; --bad: #f07a72;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.5 "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  header { padding: 1.5rem clamp(1rem, 4vw, 2.5rem) 1rem; border-bottom: 2px solid var(--ink); }
  h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1; letter-spacing: 0.04em; font-weight: 800; }
  .station-line { margin: 0.4rem 0 0; color: var(--muted); font-size: 0.95rem; overflow-wrap: anywhere; }
  main {
    display: grid; gap: 2rem; padding: 1.5rem clamp(1rem, 4vw, 2.5rem) 3rem;
    grid-template-columns: minmax(0, 22rem) minmax(0, 1fr); align-items: start;
  }
  @media (max-width: 52rem) { main { grid-template-columns: minmax(0, 1fr); } }
  h2 { font-size: 1.15rem; margin: 0 0 0.75rem; }
  form { background: var(--sheet); border: 1px solid var(--rule); padding: 1rem; }
  label { display: block; font-weight: 600; margin: 0.75rem 0 0.25rem; }
  label:first-of-type { margin-top: 0; }
  .hint { font-weight: 400; color: var(--muted); }
  input, textarea, select, button { font: inherit; color: inherit; }
  input, textarea, select {
    width: 100%; padding: 0.5rem 0.6rem; background: var(--paper); border: 1px solid var(--rule); border-radius: 2px;
  }
  textarea { min-height: 8rem; resize: vertical; }
  #to { text-transform: uppercase; font-weight: 700; letter-spacing: 0.04em; }
  button {
    margin-top: 1rem; padding: 0.6rem 1rem; border: 2px solid var(--ink); background: var(--ink);
    color: var(--paper); font-weight: 700; cursor: pointer; border-radius: 2px;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  #form-status { margin: 0.75rem 0 0; min-height: 1.5em; }
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule); margin-bottom: 0.25rem; }
  .tabs button {
    margin: 0; background: none; color: var(--muted); border: 0; border-bottom: 3px solid transparent;
    padding: 0.5rem 0.9rem; font-weight: 600;
  }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  ol.log { list-style: none; margin: 0; padding: 0; }
  ol.log li {
    display: grid; grid-template-columns: 5.5rem 7rem minmax(0, 1fr); gap: 0.25rem 1rem;
    padding: 0.7rem 0.5rem 0.7rem 0.9rem; border-bottom: 1px solid var(--rule); border-left: 4px solid transparent;
  }
  ol.log li.p1 { border-left-color: var(--priority); }
  ol.log li.p2 { border-left-color: var(--immediate); }
  ol.log li.p3 { border-left-color: var(--flash); }
  ol.log li.unread .body { font-weight: 700; }
  @media (max-width: 34rem) { ol.log li { grid-template-columns: 4.5rem minmax(0, 1fr); } ol.log .body { grid-column: 1 / -1; } }
  .when { color: var(--muted); }
  .who { font-weight: 700; letter-spacing: 0.03em; overflow-wrap: anywhere; }
  .body { overflow-wrap: anywhere; white-space: pre-wrap; }
  .subject { display: block; font-weight: 700; }
  .state { display: block; font-size: 0.9rem; margin-top: 0.2rem; color: var(--muted); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .empty { color: var(--muted); padding: 1rem 0; }
  button.read { margin: 0.3rem 0 0; padding: 0.15rem 0.5rem; font-size: 0.85rem; background: none; color: var(--ink); border-width: 1px; }
  #token-form { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: end; margin-top: 0.75rem; max-width: 40rem; border: 0; padding: 0; background: none; }
  #token-form[hidden] { display: none; }
  #token-form label { margin: 0; flex-basis: 100%; }
  #token-form input { flex: 1 1 16rem; width: auto; }
  #token-form button { margin: 0; }
  #heard-section { margin-top: 2rem; }
  ul.heard { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  ul.heard li { padding: 0.5rem 0; border-bottom: 1px solid var(--rule); }
  ul.heard .detail { display: block; font-size: 0.9rem; color: var(--muted); }
  ul.heard .detail.ok { color: var(--ok); } ul.heard .detail.warn { color: var(--warn); }
  ul.heard .detail.bad { color: var(--bad); font-weight: 700; }
  ol.log li.empty { display: block; }
  #trust-section { margin-top: 2rem; }
  ul.trust { list-style: none; margin: 0 0 0.75rem; padding: 0; border-top: 1px solid var(--rule); }
  ul.trust li { display: flex; gap: 0.5rem; align-items: baseline; padding: 0.45rem 0; border-bottom: 1px solid var(--rule); }
  ul.trust .key { flex: 1; min-width: 0; color: var(--muted); font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.trust button { margin: 0; padding: 0.1rem 0.5rem; font-size: 0.85rem; background: none; color: var(--ink); border-width: 1px; }
  #trust-form { background: none; border: 0; padding: 0; }
  #trust-form button { margin-top: 0.5rem; }
  #trust-note { font-size: 0.9rem; color: var(--muted); margin: 0.5rem 0 0; min-height: 1.4em; }
  #trust-note.ok { color: var(--ok); } #trust-note.bad { color: var(--bad); }
  ul.trust .note { color: var(--ink); font-size: 0.9rem; }
  #settings-section { margin-top: 2rem; }
  #settings-form { padding: 1rem; }
  #settings-form fieldset { border: 0; margin: 0 0 1rem; padding: 0; }
  #settings-form legend { font-weight: 700; padding: 0; margin-bottom: 0.25rem; }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 0.75rem; }
  .pair label { margin-top: 0.5rem; }
  .peer { display: grid; grid-template-columns: minmax(0, 7rem) minmax(0, 1fr) auto; gap: 0.4rem; margin-top: 0.4rem; }
  .peer input { text-transform: none; }
  .peer input:first-child { text-transform: uppercase; }
  .peer button, #add-peer { margin: 0; padding: 0.2rem 0.6rem; font-size: 0.85rem; background: none; color: var(--ink); border-width: 1px; }
  #add-peer { margin-top: 0.5rem; }
  label.check { display: flex; gap: 0.5rem; align-items: center; font-weight: 600; }
  label.check input { width: auto; }
  details { margin-top: 0.75rem; }
  summary { cursor: pointer; color: var(--muted); }
  #settings-note { font-size: 0.9rem; color: var(--muted); margin: 0.5rem 0 0; min-height: 1.4em; }
  #settings-note.ok { color: var(--ok); } #settings-note.bad { color: var(--bad); }
  dl.fixed { margin: 0.75rem 0 0; font-size: 0.9rem; color: var(--muted); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.1rem 0.75rem; }
  dl.fixed dd { margin: 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1 id="call">…</h1>
  <p class="station-line" id="station-line">Connecting to the node…</p>
  <form id="token-form" hidden>
    <label for="token">Access token <span class="hint">(printed by <code>hm node</code> at start-up, and kept in the file beside the store)</span></label>
    <input id="token" autocomplete="off" spellcheck="false">
    <button type="submit">Use token</button>
  </form>
</header>
<main>
  <section aria-labelledby="compose-title">
    <h2 id="compose-title">New message</h2>
    <form id="compose" autocomplete="off">
      <label for="to">To</label>
      <input id="to" name="to" required maxlength="9" placeholder="SO5KM-1" spellcheck="false">
      <label for="subject">Subject <span class="hint">(optional; makes it mail)</span></label>
      <input id="subject" name="subject" maxlength="128">
      <label for="text">Message</label>
      <textarea id="text" name="text" required></textarea>
      <label for="precedence">Precedence</label>
      <select id="precedence" name="precedence">
        <option value="routine">Routine</option>
        <option value="priority">Priority</option>
        <option value="immediate">Immediate</option>
        <option value="flash">Flash</option>
      </select>
      <button type="submit">Queue message</button>
      <p id="form-status" role="status"></p>
    </form>
    <div id="heard-section" aria-labelledby="heard-title">
      <h2 id="heard-title">Heard on the radio</h2>
      <ul class="heard" id="heard"></ul>
    </div>
    <div id="trust-section" aria-labelledby="trust-title">
      <h2 id="trust-title">Trusted stations</h2>
      <ul class="trust" id="trust"></ul>
      <form id="trust-form" autocomplete="off">
        <label for="trust-line">Add a station <span class="hint">(the line <code>hm whoami</code> prints on their side)</span></label>
        <input id="trust-line" required spellcheck="false" placeholder="SO5KM-1 8a1e…">
        <label for="trust-who">Note <span class="hint">(optional, e.g. a name)</span></label>
        <input id="trust-who" maxlength="80">
        <button type="submit">Trust this station</button>
        <p id="trust-note" role="status"></p>
      </form>
    </div>
    <div id="settings-section" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>
      <form id="settings-form" autocomplete="off">
        <fieldset>
          <legend>Station</legend>
          <label for="locator">Grid locator <span class="hint">(like JO89xi; sent in beacons, empty for none)</span></label>
          <input id="locator" maxlength="6" spellcheck="false" pattern="[A-Ra-r]{2}[0-9]{2}([A-Xa-x]{2})?">
        </fieldset>
        <fieldset>
          <legend>Radio</legend>
          <label class="check"><input id="r-enabled" type="checkbox"> Use a radio</label>
          <div id="radio-fields">
            <label for="r-kiss">KISS TNC <span class="hint">(Direwolf <code>127.0.0.1:8001</code>, or <code>serial:/dev/ttyUSB0:9600</code>)</span></label>
            <input id="r-kiss" spellcheck="false">
            <label for="r-audio">Sound card <span class="hint">(the built-in modem instead of a TNC; empty for a TNC)</span></label>
            <input id="r-audio" spellcheck="false" placeholder="default">
            <label for="r-ptt">PTT <span class="hint">(built-in modem: vox, rigctld, rts:/dev/ttyUSB0, cm108:/dev/hidraw0)</span></label>
            <input id="r-ptt" spellcheck="false">
            <div class="pair">
              <div><label for="r-txdelay_ms">Key-up delay <span class="hint">(ms)</span></label><input id="r-txdelay_ms" type="number" min="0" step="10"></div>
              <div><label for="r-tnc_port">TNC port</label><input id="r-tnc_port" type="number" min="0" max="15" step="1"></div>
            </div>
            <details>
              <summary>Channel access and timing</summary>
              <div class="pair">
                <div><label for="r-persist">Persistence <span class="hint">(0–255)</span></label><input id="r-persist" type="number" min="0" max="255" step="1"></div>
                <div><label for="r-slottime_ms">Slot time <span class="hint">(ms)</span></label><input id="r-slottime_ms" type="number" min="0" step="10"></div>
                <div><label for="r-bitrate">Bit rate <span class="hint">(bd)</span></label><input id="r-bitrate" type="number" min="1" step="1"></div>
                <div><label for="r-guard_ms">Guard <span class="hint">(ms)</span></label><input id="r-guard_ms" type="number" min="0" step="10"></div>
              </div>
            </details>
            <label for="beacon_minutes">Beacon every <span class="hint">(minutes; 0 turns it off)</span></label>
            <input id="beacon_minutes" type="number" min="0" step="1" required>
          </div>
          <p class="hint" id="radio-note"></p>
        </fieldset>
        <fieldset>
          <legend>Delivery</legend>
          <div class="pair">
            <div><label for="radio_cost">Radio cost</label><input id="radio_cost" type="number" min="0.01" step="0.01" required></div>
            <div><label for="internet_cost">Internet cost</label><input id="internet_cost" type="number" min="0.01" step="0.01" required></div>
          </div>
          <p class="hint">The cheaper way that reaches a station is tried first.</p>
          <div class="pair">
            <div><label for="retry_first_secs">First retry <span class="hint">(s)</span></label><input id="retry_first_secs" type="number" min="1" step="1" required></div>
            <div><label for="retry_max_secs">Longest wait <span class="hint">(s)</span></label><input id="retry_max_secs" type="number" min="1" step="1" required></div>
          </div>
          <label for="retry_attempts">Attempts before giving up</label>
          <input id="retry_attempts" type="number" min="1" step="1" required>
        </fieldset>
        <fieldset>
          <legend>Internet peers <span class="hint">(stations this node dials)</span></legend>
          <div id="peers"></div>
          <button type="button" id="add-peer">Add a peer</button>
        </fieldset>
        <button type="submit">Save settings</button>
        <p id="settings-note" role="status"></p>
        <dl class="fixed" id="fixed"></dl>
      </form>
    </div>
  </section>
  <section aria-labelledby="log-title">
    <h2 id="log-title" hidden>Messages</h2>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-in" aria-selected="true" aria-controls="log">Inbox</button>
      <button role="tab" id="tab-out" aria-selected="false" aria-controls="log">Sent</button>
    </div>
    <ol class="log" id="log" aria-live="polite"></ol>
  </section>
</main>
<script>
"use strict";
// Every message field comes from the air: build DOM nodes and set textContent only.
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
};
const hhmm = (unix) => new Date(unix * 1000).toISOString().slice(11, 16) + "Z";
const day = (unix) => new Date(unix * 1000).toISOString().slice(5, 10);
let direction = "in";
let me = "";
// The token comes from the #token= link hm node prints, or the form; it stays in this browser.
if (location.hash.startsWith("#token=")) {
  localStorage.setItem("hm-token", decodeURIComponent(location.hash.slice(7)));
  history.replaceState(null, "", location.pathname);
}
const api = async (path, opts = {}) => {
  const headers = Object.assign({ Authorization: "Bearer " + (localStorage.getItem("hm-token") || "") }, opts.headers || {});
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401) {
    document.getElementById("token-form").hidden = false;
    throw new Error("the access token is missing or wrong");
  }
  return r;
};

function describeOut(m) {
  if (m.state === "Delivered") {
    const by = m.delivered_by ? " by " + m.delivered_by : "";
    return m.verified ? ["Delivered" + by + ", receipt verified", "ok"] : ["Delivered" + by + ", receipt not verified (no key for the receiver)", "warn"];
  }
  if (m.state === "Failed") return ["Not delivered: " + (m.note || "gave up"), "bad"];
  const next = m.next_attempt * 1000 > Date.now() ? ", next try " + hhmm(m.next_attempt) : "";
  return ["Queued" + (m.attempts ? " after " + m.attempts + " attempt" + (m.attempts > 1 ? "s" : "") : "") + next, "warn"];
}

function render(list) {
  const log = document.getElementById("log");
  log.replaceChildren();
  if (list.length === 0) {
    log.append(el("li", "empty", direction === "in"
      ? "No messages yet. Messages addressed to " + me + " appear here."
      : "Nothing sent yet. Queue a message with the form."));
    return;
  }
  for (const m of list) {
    const li = el("li", "p" + Math.min(m.precedence, 3) + (m.state === "Unread" ? " unread" : ""));
    const when = el("span", "when");
    when.append(el("span", null, day(m.at)), document.createElement("br"), el("span", null, hhmm(m.at)));
    const who = el("span", "who", direction === "in" ? (m.from || m.peer) : m.peer);
    const body = el("span", "body");
    if (m.subject) body.append(el("span", "subject", m.subject));
    body.append(el("span", null, m.text !== null ? m.text : "(no text)"));
    if (direction === "in") {
      const via = m.from && m.from !== m.peer ? ", via " + m.peer : "";
      body.append(el("span", "state " + (m.verified ? "ok" : "warn"),
        (m.verified ? "Signature verified" : "Signature not verified (sender not among your trusted stations)") + via));
      if (m.state === "Unread") {
        const b = el("button", "read", "Mark read");
        b.addEventListener("click", async () => { await api("/api/read/" + m.id, { method: "POST" }); refresh(); });
        body.append(b);
      }
    } else {
      const [text, cls] = describeOut(m);
      body.append(el("span", "state " + cls, text));
    }
    li.append(when, who, body);
    log.append(li);
  }
}

async function refresh() {
  try {
    const r = await api("/api/messages?direction=" + direction + "&limit=200");
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    render(await r.json());
  } catch (e) {
    document.getElementById("station-line").textContent = "Cannot reach the node: " + e.message;
  }
}

const ago = (s) => s < 90 ? s + " s ago" : s < 5400 ? Math.round(s / 60) + " min ago" : Math.round(s / 3600) + " h ago";
const KEY = {
  trusted: ["Key matches the one you trust", "ok"],
  unknown: ["Not among your trusted stations", "warn"],
  mismatch: ["Key differs from the one you trust: an impostor, or a new key", "bad"],
};

const compass = (deg) => ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(deg / 45) % 8] + " (" + deg + "°)";

function renderHeard(list) {
  const ul = document.getElementById("heard");
  ul.replaceChildren();
  if (!list || list.length === 0) {
    ul.append(el("li", "empty", "No stations heard yet."));
    return;
  }
  for (const h of list) {
    const li = el("li");
    li.append(el("span", "who", h.station), el("span", "when", " · " + ago(h.ago)));
    if (h.locator) {
      const where = h.distance_km !== null ? " · " + h.locator + ", " + h.distance_km + " km " + compass(h.bearing) : " · " + h.locator;
      li.append(el("span", "when", where));
    }
    if (h.key) {
      const [text, cls] = KEY[h.key] || [h.key, "warn"];
      li.append(el("span", "detail " + cls, text));
      const offers = h.offers.length ? "Offers " + h.offers.join(", ") + ". " : "";
      const hears = h.hears.length ? "Hears " + h.hears.join(", ") + "." : "Hears no one yet.";
      li.append(el("span", "detail", offers + hears));
    } else {
      li.append(el("span", "detail", "No beacon heard yet."));
    }
    ul.append(li);
  }
}

let trustFile = null;

async function loadTrust() {
  try {
    const r = await api("/api/trust");
    if (!r.ok) return;
    const t = await r.json();
    trustFile = t.file;
    const ul = document.getElementById("trust");
    ul.replaceChildren();
    if (t.stations.length === 0) ul.append(el("li", "empty", "Nobody yet. Messages from untrusted stations arrive marked unverified."));
    for (const s of t.stations) {
      const li = el("li");
      const b = el("button", null, "Remove");
      b.setAttribute("aria-label", "Stop trusting " + s.station);
      b.addEventListener("click", async () => {
        if (!confirm("Stop trusting " + s.station + "?")) return;
        const r = await api("/api/trust/" + encodeURIComponent(s.station), { method: "DELETE" });
        note(r.ok ? s.station + " is no longer trusted." : "Not removed: " + ((await r.json()).error || r.statusText), r.ok ? "" : "bad");
        loadTrust();
      });
      const key = el("span", "key", s.key);
      if (s.note) key.prepend(el("span", "note", s.note + " · "));
      li.append(el("span", "who", s.station), key, b);
      ul.append(li);
    }
  } catch (e) { /* the status line already says the node is unreachable */ }
}

function note(text, cls) {
  const n = document.getElementById("trust-note");
  n.className = cls || "";
  n.textContent = text + (trustFile ? "" : " Not saved: this node has no settings file, so it lasts until restart.");
}

document.getElementById("trust-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const input = document.getElementById("trust-line");
  const who = document.getElementById("trust-who");
  const body = { line: input.value.trim() };
  if (who.value.trim()) body.note = who.value.trim();
  const r = await api("/api/trust", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (r.ok) {
    const s = await r.json();
    note(s.station + " is trusted now" + (trustFile ? " and saved to " + trustFile + "." : "."), "ok");
    input.value = ""; who.value = "";
  } else {
    note("Not added: " + ((await r.json()).error || r.statusText), "bad");
  }
  loadTrust();
});

const radioText = ["kiss", "audio", "ptt"];
const radioNumbers = ["txdelay_ms", "tnc_port", "persist", "slottime_ms", "bitrate", "guard_ms"];
const liveFields = ["beacon_minutes", "radio_cost", "internet_cost", "retry_first_secs", "retry_max_secs", "retry_attempts"];
let settingsFile = null;

function peerRow(p) {
  const row = el("div", "peer");
  const call = el("input"); call.value = p.station; call.placeholder = "SO5KM"; call.maxLength = 9;
  call.setAttribute("aria-label", "Peer callsign"); call.spellcheck = false;
  const addr = el("input"); addr.value = p.address; addr.placeholder = "hub.example.org:4433";
  addr.setAttribute("aria-label", "Peer address (host:port)"); addr.spellcheck = false;
  const b = el("button", null, "Remove"); b.type = "button";
  b.addEventListener("click", () => row.remove());
  row.append(call, addr, b);
  return row;
}

function settingsNote(text, cls) {
  const n = document.getElementById("settings-note");
  n.className = cls || "";
  n.textContent = text;
}

function showSettings(v) {
  settingsFile = v.file;
  const f = document.getElementById("settings-form");
  // Leave the form alone while someone is editing it.
  if (f.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return;
  for (const k of liveFields) document.getElementById(k).value = v.live[k];
  document.getElementById("locator").value = v.live.locator || "";
  const r = v.live.radio;
  document.getElementById("r-enabled").checked = r.enabled;
  for (const k of radioText.concat(radioNumbers)) document.getElementById("r-" + k).value = r[k];
  document.getElementById("radio-fields").hidden = !r.enabled;
  document.getElementById("radio-note").textContent = v.radio_applies_now
    ? "Radio changes open the new link at once."
    : "Radio changes are saved and take a restart of the node.";
  document.getElementById("peers").replaceChildren(...v.live.peers.map(peerRow));
  const fixed = v.restart_to_change;
  const rows = [["Internet", fixed.internet_listen ? "listening on " + fixed.internet_listen : "not listening"],
    ["Web page", fixed.http], ["Store", fixed.store], ["Saved to", v.file || "nowhere: changes last until restart"]];
  if (v.overridden.length) rows.push(["For this run", "set on the command line: " + v.overridden.join(", ") + " (changes to these are saved, and used once the node runs without them)"]);
  const dl = document.getElementById("fixed");
  dl.replaceChildren();
  for (const [k, val] of rows) dl.append(el("dt", null, k), el("dd", null, val));
}

async function loadSettings() {
  try {
    const r = await api("/api/settings");
    if (r.ok) showSettings(await r.json());
  } catch (e) { /* the status line already says the node is unreachable */ }
}

document.getElementById("r-enabled").addEventListener("change", (ev) => {
  document.getElementById("radio-fields").hidden = !ev.target.checked;
});

document.getElementById("add-peer").addEventListener("click", () => {
  const row = peerRow({ station: "", address: "" });
  document.getElementById("peers").append(row);
  row.querySelector("input").focus();
});

document.getElementById("settings-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const body = {};
  for (const k of liveFields) body[k] = Number(document.getElementById(k).value);
  body.locator = document.getElementById("locator").value.trim();
  body.radio = { enabled: document.getElementById("r-enabled").checked };
  for (const k of radioText) body.radio[k] = document.getElementById("r-" + k).value.trim();
  for (const k of radioNumbers) body.radio[k] = Number(document.getElementById("r-" + k).value);
  body.peers = [...document.querySelectorAll("#peers .peer")]
    .map((row) => { const [c, a] = row.querySelectorAll("input"); return { station: c.value.trim().toUpperCase(), address: a.value.trim() }; })
    .filter((p) => p.station || p.address);
  const r = await api("/api/settings", { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (r.ok) {
    document.activeElement.blur();
    showSettings(j);
    settingsNote("In use now" + (settingsFile ? " and saved to " + settingsFile + "." : "; not saved, this node has no settings file."), "ok");
  } else {
    settingsNote("Not changed: " + (j.error || r.statusText), "bad");
  }
});

async function loadStatus() {
  try {
    const s = await (await api("/api/status")).json();
    me = s.call;
    document.getElementById("call").textContent = s.call;
    document.title = s.call + " · hm-net";
    const grid = s.locator ? s.locator + ". " : "";
    const radio = grid + (s.radio === null ? "No radio." : s.radio ? "Radio up: " + s.radio_via + "." : "Radio down (" + s.radio_via + ").");
    const peers = s.internet_peers.length ? "linked to " + s.internet_peers.join(", ") : "no stations linked";
    const net = s.internet_listen ? " Internet: " + peers + "." : "";
    document.getElementById("station-line").textContent = radio + net + " Your line for other stations: " + s.trust_line;
    document.getElementById("heard-section").hidden = s.radio === null;
    renderHeard(s.heard);
    document.getElementById("token-form").hidden = true;
  } catch (e) {
    document.getElementById("station-line").textContent = "Cannot reach the node: " + e.message;
  }
}

document.getElementById("token-form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  localStorage.setItem("hm-token", document.getElementById("token").value.trim());
  loadStatus();
  loadTrust();
  loadSettings();
  refresh();
});

for (const [id, dir] of [["tab-in", "in"], ["tab-out", "out"]]) {
  document.getElementById(id).addEventListener("click", () => {
    direction = dir;
    document.getElementById("tab-in").setAttribute("aria-selected", String(dir === "in"));
    document.getElementById("tab-out").setAttribute("aria-selected", String(dir === "out"));
    refresh();
  });
}

document.getElementById("compose").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  const status = document.getElementById("form-status");
  const body = { to: f.to.value.trim().toUpperCase(), text: f.text.value, precedence: f.precedence.value };
  if (f.subject.value.trim()) body.subject = f.subject.value.trim();
  status.className = "";
  status.textContent = "Queuing…";
  try {
    const r = await api("/api/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    status.className = "ok";
    status.textContent = "Queued for " + body.to + ". It goes out when the channel allows; follow it under Sent.";
    f.text.value = ""; f.subject.value = "";
    if (direction === "out") refresh();
  } catch (e) {
    status.className = "bad";
    status.textContent = "Not queued: " + e.message;
  }
});

loadStatus();
refresh();
setInterval(refresh, 3000);
setInterval(loadStatus, 10000);
loadTrust();
setInterval(loadTrust, 10000);
loadSettings();
setInterval(loadSettings, 10000);
</script>
</body>
</html>
