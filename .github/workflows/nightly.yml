name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  oracle:
    name: simulator vs oracle, 10,000 seeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: HM_SEEDS=10000 cargo test -p hm-sim --release --test oracle -- --nocapture

  modem-curve:
    name: modem frame-loss table vs the modem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p hm-sim --release --test afsk afsk_1200_curve -- --ignored --nocapture

  mutations:
    name: decoder mutations, 1,000,000 inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: HM_MUTATIONS=1000000 cargo test -p hm-bundle --release --test mutations -- --nocapture

  fuzz:
    name: fuzz ${{ matrix.target }}, 10 minutes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [frame, ack, envelope, bundle, binding, callsign, kiss, ax25, xfer, beacon]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} -- -max_total_time=600 -max_len=4096
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
