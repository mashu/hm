name: ci

# Pull requests and main run on Linux only; a release tag (v*) also runs the
# tests on Windows and macOS, which are much slower. Running the workflow by
# hand (Actions > ci > Run workflow) tests any branch on all three.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: ALSA headers for the sound-card crate
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Fuzz targets run nightly; here we only make sure they still compile.
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins

  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        toolchain: [stable, "1.90"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      # Direwolf's gen_packets and atest check the modem against Direwolf
      # (AX.25 and IL2P, both directions); those tests are skipped without it.
      - name: ALSA headers for the sound-card crate, and Direwolf
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev direwolf
      # Includes the pinned simulator trace, so on a release tag this also checks
      # that runs are identical across operating systems.
      - run: cargo test --workspace

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install blake3 pynacl cbor2
      - run: cargo run -q -p hm-bundle --example vectors | python3 tools/check_vectors.py

  cross-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-linux-android, aarch64-apple-ios, armv7-unknown-linux-gnueabihf]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # These are the no_std + alloc protocol builds. hm-bundle's default
      # `std` feature enables zstd-sys, which correctly needs each platform's
      # C toolchain and is already exercised by the native jobs above.
      - run: cargo check --target ${{ matrix.target }} --no-default-features -p hm-core -p hm-wire -p hm-ident -p hm-bundle
